# Configuración para publicar en Netlify
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Demo privada: que los buscadores no la indexen
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Todas las fichas (/inmuebles/1440/) se sirven desde una sola página,
# así los inmuebles nuevos del panel tienen ficha al momento.
[[redirects]]
  from = "/inmuebles/:ref/"
  to = "/inmuebles/ficha/"
  status = 200

[[redirects]]
  from = "/inmuebles/:ref"
  to = "/inmuebles/ficha/"
  status = 200

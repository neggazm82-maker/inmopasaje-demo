<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Formularios</title></head>
<body>
<!-- Netlify lee este archivo al publicar para saber qué formularios existen. No se muestra a nadie. -->
<form name="valoracion" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
  <input name="bot-field"><input name="operacion"><input name="tipo"><input name="zona"><input name="metros">
  <input name="habitaciones"><input name="banos"><input name="planta"><input name="ascensor"><input name="terraza">
  <input name="garaje"><input name="estado"><input name="direccion"><input name="nombre"><input name="telefono">
  <input name="email"><input name="comentarios"><input name="resumen">
  <input type="file" name="foto1"><input type="file" name="foto2"><input type="file" name="foto3"><input type="file" name="foto4">
</form>
<form name="avisame" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field"><input name="operacion"><input name="tipo"><input name="zona"><input name="habitaciones">
  <input name="precioMaximo"><input name="nombre"><input name="telefono"><input name="resumen">
</form>
<form name="contacto" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field"><input name="nombre"><input name="telefono"><input name="email"><textarea name="mensaje"></textarea>
</form>
</body></html>
